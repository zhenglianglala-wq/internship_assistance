<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>lalaliang · 手机岗位接收</title><link rel="stylesheet" href="/receiver.css"><script src="/receiver.js" defer></script></head><body><main><div class="brand">✦ lalaliang <span>手机岗位接收</span></div><div class="badges"><span>iPhone</span><span>Android</span><span>本地网络</span></div><h1>看到好机会，<br>带回你的工作台。</h1><p class="intro">从招聘 App 复制分享文字或链接，粘贴到这里。也可以上传岗位截图，在电脑本机提取文字。</p><form id="share"><label>岗位来自<select name="platform"><option value="auto">自动识别</option><option value="boss">BOSS直聘</option><option value="shixiseng">实习僧</option><option value="liepin">猎聘</option><option value="other">其他 App</option></select></label><label>分享文字或链接<textarea name="text" rows="7" maxlength="30000" placeholder="粘贴岗位标题、公司、要求与分享链接…"></textarea></label><label class="image">或者选择岗位截图<input name="image" type="file" accept="image/png,image/jpeg"></label><p class="hint">仅 PNG / JPEG，最大8MB。截图处理后删除，提取文字保存在电脑。链接不会自动读取 App 中的完整详情。</p><button type="submit">送到电脑，等待核对</button><p id="result" role="status" aria-live="polite"></p></form><p class="foot">仅接收岗位内容，不展示简历、邮箱或模型密钥。电脑端开启30分钟后自动关闭。请使用可信的同一 Wi-Fi 网络；此通道采用 HTTP。</p></main></body></html>
